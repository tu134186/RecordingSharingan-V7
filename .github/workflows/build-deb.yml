name: Build RecordingSharingan integration
on:
  workflow_dispatch:
  push:
    branches: ['feature/island-volume-v6.19']
    paths: ['.ci/build-request']
permissions:
  contents: write
concurrency:
  group: recordingsharingan-integration
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and package complete source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib,zipfile,os
          root=Path('.')
          version=next(s.split(':',1)[1].strip() for s in Path('control').read_text().splitlines() if s.startswith('Version:'))
          assert version=='7.11.9.4.3.2.6.19'
          for p in root.rglob('*.plist'):
              if '.git' not in p.parts:plistlib.loads(p.read_bytes())
          for name in ['RecordingSharinganPrefs','IslandVolume/prefs']:
              info=plistlib.loads((root/name/'Resources/Info.plist').read_bytes())
              assert info['CFBundleVersion']==version
              assert info['CFBundleShortVersionString']==version
          assert '[self adjust:0.1f]' in Path('RecordingSharinganPrefs/RSAdjustCell.m').read_text()
          assert Path('IslandVolume/LICENSE').is_file()
          assert 'RSIVPrefBool(@"Enabled", NO)' in Path('IslandVolume/RSIVPrefs.m').read_text()
          out=Path('_delivery');out.mkdir()
          with zipfile.ZipFile(out/(version+'-RecordingSharingan-source.zip'),'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and not any(x in p.parts for x in ('.git','.theos','packages','_delivery')) and p.suffix!='.zip':z.write(p,p.as_posix())
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('DELIVERY_VERSION='+version+'\n')
          PY
      - name: Install build dependencies
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          brew install ldid xz dpkg
          if ! find "$HOME/theos/sdks" -maxdepth 1 -name '*.sdk' -type d | grep -q .; then
            git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
            cp -R "$RUNNER_TEMP/theos-sdks/"*.sdk "$HOME/theos/sdks/"
          fi
      - name: Compile integrated DEB
        run: |
          set -o pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee build-output.log
      - name: Verify packaged modules and dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,plistlib,shutil,hashlib,os
          packages=list(Path('packages').glob('*.deb'));assert len(packages)==1,packages
          deb=packages[0]
          assert subprocess.check_output(['dpkg-deb','-f',str(deb),'Version'],text=True).strip()==os.environ['DELIVERY_VERSION']
          dest=Path('_unpacked');subprocess.run(['dpkg-deb','-x',str(deb),str(dest)],check=True)
          for binary in ['RecordingSharingan.dylib','RSIslandVolume.dylib']:
              files=list(dest.rglob(binary));assert len(files)==1,files
          for name in ['RecordingSharinganPrefs.bundle','RSIslandVolumePrefs.bundle']:
              bundles=list(dest.rglob(name));assert len(bundles)==1,bundles
              info=plistlib.loads((bundles[0]/'Info.plist').read_bytes())
              assert info['CFBundleVersion']==os.environ['DELIVERY_VERSION']
              assert (bundles[0]/info['CFBundleExecutable']).is_file()
          dylib=next(dest.rglob('RSIslandVolume.dylib'))
          linked=subprocess.check_output(['otool','-L',str(dylib)],text=True)
          for framework in ['MediaPlayer.framework','AVFoundation.framework','CoreMedia.framework','AudioToolbox.framework']:assert framework not in linked
          filters=plistlib.loads(next(dest.rglob('RSIslandVolume.plist')).read_bytes())
          assert set(filters['Filter']['Bundles'])=={'com.apple.MediaRemoteUI','com.apple.springboard'}
          assert list(dest.rglob('Crescendo-GPL-3.0.txt'))
          out=Path('_delivery')
          shutil.copy2(deb,out/(os.environ['DELIVERY_VERSION']+'-RecordingSharingan.deb'))
          (out/'BUILD-VERIFICATION.txt').write_text('Validated both dylibs, both preference bundles, matching versions, filter, third-party license, and no forced media framework dependencies.\n'+linked)
          files=sorted(out.iterdir());(out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RecordingSharingan-6.19
          path: _delivery/*
          if-no-files-found: error
      - name: Publish direct downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "delivery-${DELIVERY_VERSION}-${GITHUB_RUN_ID}" _delivery/* --target "$GITHUB_SHA" --title "RecordingSharingan ${DELIVERY_VERSION}" --notes "Independent Crescendo-derived volume module, opt-in from Sharingan settings. Recording runtime retained from 6.17. Both dylibs/bundles and licenses verified. Device testing pending. Run ${GITHUB_RUN_ID}; commit ${GITHUB_SHA}."
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RecordingSharingan-6.19-build-logs
          path: |
            build-output.log
            _delivery/*-source.zip
          if-no-files-found: warn
